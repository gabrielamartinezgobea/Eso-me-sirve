<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito de Compra</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fcfcfc;
            background-image: url('13.png');
            padding: 40px 20px;
            color: #2e1502;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            border-bottom: 2px solid #2e1502;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .detalle-compra {
            background-color: #eaf5f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .fila {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .total {
            border-top: 1px dashed #2e1502;
            padding-top: 10px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        /* Botón de Pago */
        .btn-pagar {
            background-color: #f16501;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-pagar:hover {
            background-color: #cc0000;
        }

        .Volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666666;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Resumen de tu Carrito de Compra</h1>
        
        <div class="detalle-compra">
            <div class="fila">
                <span>Producto:</span>
                <span id="nombre-producto" style="font-weight: bold;">Cargando...</span>
            </div>
            <div class="fila total">
                <span>Total a pagar:</span>
                <span id="precio-producto">0.00 €</span>
            </div>
        </div>

        <!-- Opción de pagar -->
        <button class="btn-pagar" onclick="procesarPago()">Proceder al Pago</button>
        
        <a href="cataloge.html" class="Volver">← Volver al catálogo</a>
    </div>

</body>
</html>
